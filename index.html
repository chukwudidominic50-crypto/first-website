<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THRIFT HAVEN | Vintage Fashion</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f7f3;
    color: #222;
}

header {
    background: #171717;
    color: white;
    padding: 22px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
}

.hero {
    min-height: 480px;
    background: linear-gradient(#0007,#0007),
    url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1600')
    center/cover;
    display: flex;
    align-items: center;
    padding: 8%;
    color: white;
}

.hero h1 {
    font-size: 55px;
    max-width: 550px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 18px;
    margin-bottom: 30px;
}

.button {
    background: #d6a85c;
    color: black;
    padding: 15px 25px;
    text-decoration: none;
    display: inline-block;
    font-weight: bold;
}

.section {
    padding: 65px 8%;
}

.section h2 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 35px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.product {
    background: white;
    padding-bottom: 20px;
}

.product img {
    width: 100%;
    height: 280px;
    object-fit: cover;
}

.product h3 {
    margin: 15px;
}

.product p {
    margin: 0 15px 15px;
    color: #777;
}

.product a {
    margin-left: 15px;
    background: #171717;
    color: white;
    padding: 12px 18px;
    text-decoration: none;
    display: inline-block;
}

.about {
    background: #171717;
    color: white;
    text-align: center;
    padding: 65px 10%;
}

footer {
    background: black;
    color: white;
    text-align: center;
    padding: 25px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 8px;
    }

    .hero h1 {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">THRIFT HAVEN.</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#shop">Shop</a>
        <a href="#about">About</a>
    </nav>
</header>

<section class="hero" id="home">
    <div>
        <h1>STYLE THAT DOESN'T BREAK THE BANK.</h1>
        <p>Discover unique thrift pieces. Look good. Spend less.</p>
        <a href="#shop" class="button">SHOP COLLECTION</a>
